############################################## - ⚓️ 锚点区开始 - ##############################################
# 锚点 - 筛选组
FilterSelect: &FilterSelect {filter: '^(?=.*(?i)(香港|🇭🇰|HK|台湾|🇹🇼|TW|日本|🇯🇵|JP|美国|🇺🇸|US|新加坡|狮城|🇸🇬|SG))(?!.*(2.00x|排除2)).*$'}
FilterOthers: &FilterOthers {filter: '^(?!.*(DIRECT|Traffic|TRAFFIC|Expire|EXPIRE|流量|到期|时间|重置))'}
FilterHK: &FilterHK {filter: '^(?=.*(?i)(香港|🇭🇰|HK))(?!.*(2.00x|排除2)).*$'}
FilterTW: &FilterTW {filter: '^(?=.*(?i)(台湾|🇹🇼|TW))(?!.*(2.00x|排除2)).*$'}
FilterJP: &FilterJP {filter: '^(?=.*(?i)(日本|🇯🇵|JP))(?!.*(2.00x|排除2)).*$'}
FilterSG: &FilterSG {filter: '^(?=.*(?i)(新加坡|狮城|🇸🇬|SG))(?!.*(2.00x|排除2)).*$'}
FilterUS: &FilterUS {filter: '^(?=.*(?i)(美国|🇺🇸|US))(?!.*(2.00x|排除2)).*$'}
# 锚点 - 策略组
Select: &Select {type: select, include-all-providers: true, interrupt-exist-connections: true, proxies: ['自动选择', '手动选择', '🇭🇰 香港自动', '🇹🇼 台湾自动', '🇯🇵 日本自动', '🇸🇬 狮城自动', '🇺🇸 美国自动', '🌐 本地直连', '⛔️ 拒绝连接']}
UrlTest: &UrlTest {type: url-test, interrupt-exist-connections: false, hidden: true, interval: 180, tolerance: 200, url: 'https://captive.apple.com/generate_204'}
Fallback: &Fallback {type: fallback, interrupt-exist-connections: true, hidden: true, interval: 60, url: 'https://captive.apple.com/generate_204'}
# 锚点 - 规则集
IPCIDR: &IPCIDR {type: http, interval: 86400, behavior: ipcidr, format: mrs}
Domain: &Domain {type: http, interval: 86400, behavior: domain, format: mrs}
Classical: &Classical {type: http, interval: 86400, behavior: classical, format: text}
# 锚点 - 远程订阅组
Providers: &Providers {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://captive.apple.com/generate_204', interval: 600}, <<: *FilterOthers}
############################################## - ⚓️ 锚点区结束 - ##############################################

# 节点订阅
proxy-providers:
  SNTP: {<<: *Providers, url: 'http://localhost:3000/download/SNTP', path: ./providers/SNTP.yaml, override: {additional-prefix: 'STP・'}}
  Vitebits: {<<: *Providers, url: 'http://localhost:3000/download/Vitebits', path: ./providers/Vitebits.yaml, override: {additional-prefix: 'VTB・'}}

# 基础配置
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
mode: rule
log-level: silent
ipv6: false
allow-lan: true
bind-address: '*'
unified-delay: true
tcp-concurrent: true
find-process-mode: always
authentication: ['Ruruka:DaiSuiKi']
skip-auth-prefixes: ['127.0.0.1/8', '::1/128']

external-ui-url: 'https://v6.gh-proxy.org/github.com/Zephyruso/zashboard/releases/download/v1.101.1/dist.zip'
external-ui: ./webui
external-controller: 0.0.0.0:9090
secret: ''

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff: {HTTP: {ports: [80, 8080-8880], override-destination: true}, TLS: {ports: [443, 8443]}, QUIC: {ports: [443, 8443]}}
  skip-domain: ['Mijia Cloud']

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['RULE-SET:Fakeip-Filter']
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']

tun:
  enable: false
  mtu: 9000
  stack: gvisor
  device: Meta
  dns-hijack: ['any:53', 'tcp://any:53']
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true

proxies:
  - {name: '🌐 本地直连', type: direct, udp: true}
  - {name: '⛔️ 拒绝连接', type: reject}
  - {name: '🔰 DNS-Hijack', type: dns}

