############################################## - ⚓️ 锚点区开始 - ##############################################
# 锚点 - 筛选组
FilterSelect: &FilterSelect {filter: '^(?=.*(?i)(香港|🇭🇰|HK|HKG|台湾|🇹🇼|TW|TWN|日本|🇯🇵|JP|JPN|美国|🇺🇸|US|USA))(?!.*(2.00x|排除2)).*$'}
FilterOthers: &FilterOthers {filter: '^(?!.*(DIRECT|Traffic|TRAFFIC|Expire|EXPIRE|流量|到期|时间|重置))'}
FilterHK: &FilterHK {filter: '^(?=.*(?i)(香港|🇭🇰|HK|HKG))(?!.*(2.00x|排除2)).*$'}
FilterTW: &FilterTW {filter: '^(?=.*(?i)(台湾|🇹🇼|TW|TWN))(?!.*(2.00x|排除2)).*$'}
FilterJP: &FilterJP {filter: '^(?=.*(?i)(日本|🇯🇵|JP|JPN))(?!.*(2.00x|排除2)).*$'}
FilterUS: &FilterUS {filter: '^(?=.*(?i)(美国|🇺🇸|US|USA))(?!.*(2.00x|排除2)).*$'}
# 锚点 - 选择组
Select: &Select {type: select, include-all-providers: true, proxies: ['Proxy', 'Auto', 'AutoHK', 'AutoTW', 'AutoJP', 'AutoUS', '🌐 Direct', '⛔️ Reject']}
# 锚点 - 自动组
UrlTest: &UrlTest {type: url-test, tolerance: 50, hidden: true, use: ['SNTP']}
# 锚点 - 规则集
IPCIDR: &IPCIDR {type: http, interval: 86400, behavior: ipcidr, format: mrs}
Domain: &Domain {type: http, interval: 86400, behavior: domain, format: mrs}
Classical: &Classical {type: http, interval: 86400, behavior: classical, format: text}
# 锚点 - 远程订阅组
Providers: &Providers {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://captive.apple.com/generate_204', interval: 600}, <<: *FilterOthers}
############################################## - ⚓️ 锚点区结束 - ##############################################

# 节点订阅
proxy-providers:
  SNTP: {<<: *Providers, url: 'http://192.168.10.3:3000/download/SNTP', path: ./providers/SNTP.yaml, override: {additional-prefix: 'STP '}}
  SakuraCat: {<<: *Providers, url: 'http://192.168.10.3:3000/download/SakuraCat', path: ./providers/SakuraCat.yaml, override: {additional-prefix: 'SC '}}

# 基础配置
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
mode: rule
log-level: silent
ipv6: false
allow-lan: true
bind-address: '*'
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

# 管理面板配置
external-ui-url: 'https://v6.gh-proxy.com/github.com/Zephyruso/zashboard/releases/download/v1.101.1/dist.zip'
external-ui: ./WebUI
external-controller: 0.0.0.0:9090
secret: ''

# 缓存配置
profile:
  store-selected: true
  store-fake-ip: true

# 域名嗅探配置
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff: {HTTP: {ports: [80, 8080-8880], override-destination: true}, TLS: {ports: [443, 8443]}, QUIC: {ports: [443, 8443]}}
  skip-domain: ['Mijia Cloud']

# Hosts配置
hosts:
  mtalk.google.com: 142.250.107.188
  alt1-mtalk.google.com: 172.217.78.188
  alt2-mtalk.google.com: 192.178.164.188
  alt3-mtalk.google.com: 172.253.135.188
  alt4-mtalk.google.com: 172.217.74.188
  alt5-mtalk.google.com: 172.217.74.188
  alt6-mtalk.google.com: 74.125.27.188
  alt7-mtalk.google.com: 192.178.209.188
  alt8-mtalk.google.com: 192.178.152.188

# DNS配置
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter: ['RULE-SET,Fakeip-Filter,real-ip', 'MATCH,fake-ip']
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']

# TUN模式配置
tun:
  enable: true
  mtu: 9000
  stack: gvisor
  device: Meta
  dns-hijack: ['any:53', 'tcp://any:53']
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true

# 出站节点
proxies:
  - {name: '🌐 Direct', type: direct, udp: true}
  - {name: '⛔️ Reject', type: reject}

# 策略组
